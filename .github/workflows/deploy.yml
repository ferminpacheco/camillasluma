# Cada push a main compila Eleventy y sube _site a Hostinger por FTP.
# Los datos del FTP están como secrets del repo: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
name: Deploy a Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Subir _site a public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./_site/
          # La cuenta FTP entra a la carpeta de usuario de Hostinger; la web vive en
          # domains/camillasluma.com/public_html (verificado el 13/11 listando el FTP).
          server-dir: ./domains/camillasluma.com/public_html/
          # sube solo lo que cambió; no borra archivos que no estén en _site
