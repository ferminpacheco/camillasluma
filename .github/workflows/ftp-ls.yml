# Diagnóstico temporal: lista la raíz del FTP para ubicar public_html. Solo lectura. Borrar después.
name: FTP ls (diagnóstico)
on:
  push:
    branches: [diag/ftp-ls]
jobs:
  ls:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "--- domains"; curl -s --user "$U:$P" "ftp://$S/domains/" -l || true
          for d in $(curl -s --user "$U:$P" "ftp://$S/domains/" -l | grep -v '^\.'); do echo "--- domains/$d"; curl -s --user "$U:$P" "ftp://$S/domains/$d/" -l; echo "--- domains/$d/public_html/blog"; curl -s --user "$U:$P" "ftp://$S/domains/$d/public_html/blog/" -l; done
        env:
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          S: ${{ secrets.FTP_SERVER }}
