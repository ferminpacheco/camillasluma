# Diagnóstico temporal: lista la raíz del FTP para ubicar public_html. Solo lectura. Borrar después.
name: FTP ls (diagnóstico)
on:
  push:
    branches: [diag/ftp-ls]
jobs:
  ls:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "--- raíz"; curl -s --user "$U:$P" "ftp://$S/" -l || true
          echo "--- public_html"; curl -s --user "$U:$P" "ftp://$S/public_html/" -l | head -40 || true
          echo "--- blog"; curl -s --user "$U:$P" "ftp://$S/blog/" -l || true
          echo "--- public_html/blog"; curl -s --user "$U:$P" "ftp://$S/public_html/blog/" -l || true
        env:
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          S: ${{ secrets.FTP_SERVER }}
